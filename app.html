<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISIOON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="wrap narrow">
  <div class="logo-bar">
    <span class="logo-mount"></span>
    <button class="btn ghost small" id="btnLogout">Logg ut</button>
  </div>

  <nav class="tabs">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="historikk">Historikk</button>
  </nav>

  <!-- DASHBOARD -->
  <div class="tab active" id="tab-dashboard">
    <div class="hero-card" id="heroCard">
      <h2 class="hero-greeting" id="greeting"></h2>
      <p class="hero-subtext" id="weekHeader"></p>
      <div class="hero-stats">
        <span class="hero-week" id="weekLabel"></span>
        <span class="hero-streak" id="heroStreak" style="display:none;"></span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
      <div class="hero-progress-label" id="progressLabel"></div>
    </div>

    <div class="banner" id="focusBanner" style="display:none;"></div>

    <div id="taskList"></div>
  </div>

  <!-- HISTORIKK -->
  <div class="tab" id="tab-historikk">
    <div id="streakBox" style="margin-bottom:12px;"></div>
    <div id="historyList"></div>
  </div>
</div>

<div class="celebrate-toast" id="celebrateToast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/logo.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/store.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
